name: Demand Gen - Social Digest

# Surfaces public posts explicitly asking for a BPO/outsourcing partner.
# Never posts anything - writes a reviewable digest of drafted replies only.
# See demand-gen/social/reddit_monitor.py for why.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: demand-gen-social
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r demand-gen/requirements.txt
      - run: python demand-gen/social/reddit_monitor.py
      - name: Commit digest if anything new was found
        run: |
          git config user.name "demand-gen-bot"
          git config user.email "demand-gen-bot@users.noreply.github.com"
          git add demand-gen/social/digest demand-gen/social/seen.json
          git commit -m "Social digest: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "nothing new"
          for attempt in 1 2 3; do
            git push -q && break
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
